name: Feature request
description: Propose an MVP-compatible improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What procurement or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Keep it production-lean. Note whether it needs SDK/interceptor/worker-plugin changes or a workflow-engine change.
    validations:
      required: true
  - type: dropdown
    id: extension
    attributes:
      label: Preferred extension point
      options:
        - SDK API (workflow/activity/signal/query)
        - Interceptor
        - Worker Plugin / adapter
        - Dynamic configuration
        - Server source rework (requires a VENDOR_MODIFICATIONS.md entry)
