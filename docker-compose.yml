services:
  postgres:
    image: postgres:16-alpine
    container_name: procureflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: procureflow
      POSTGRES_PASSWORD: procureflow
      POSTGRES_DB: procureflow
    ports:
      - "5432:5432"
    volumes:
      - procureflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureflow -d procureflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  procureflow_pgdata:
