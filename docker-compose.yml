x-shared-environment: &shared-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-procureflow}:${POSTGRES_PASSWORD:-procureflow}@postgres:5432/${POSTGRES_DB:-procureflow}
  DIRECT_URL: postgresql://${POSTGRES_USER:-procureflow}:${POSTGRES_PASSWORD:-procureflow}@postgres:5432/${POSTGRES_DB:-procureflow}
  DATABASE_SSL: "false"
  DATABASE_POOLED: "false"
  WORKFLOW_ENGINE_ADDRESS: engine:7233
  WORKFLOW_ENGINE_NAMESPACE: default
  WORKFLOW_ENGINE_TASK_QUEUE: procureflow
  WORKFLOW_ENGINE_TLS: "false"
  WORKFLOW_ENGINE_SEARCH_ATTRIBUTES: "false"
  EMAIL_ADAPTER: console
  EMAIL_FROM: ${EMAIL_FROM:-procureflow@example.com}
  ERP_ADAPTER: csv
  ERP_CSV_DIR: .data/erp
  STORAGE_ADAPTER: local
  STORAGE_DIR: .data/storage
  AI_RISK_SUMMARY_ENABLED: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-procureflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procureflow}
      POSTGRES_DB: ${POSTGRES_DB:-procureflow}
    volumes:
      - procureflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-procureflow} -d ${POSTGRES_DB:-procureflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

  engine:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-procureflow}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-procureflow}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy

  assistant:
    build:
      context: .
      dockerfile: services/assistant/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:${ASSISTANT_HOST_IP:-host-gateway}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-procureflow}:${POSTGRES_PASSWORD:-procureflow}@postgres:5432/${POSTGRES_DB:-procureflow}
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN:-dev-assistant-token}
      ASSISTANT_LLM_BASE_URL: ${ASSISTANT_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-phi4-mini:3.8b}
      ASSISTANT_MODEL_QUANTIZATION: ${ASSISTANT_MODEL_QUANTIZATION:-Q4_K_M}
      ASSISTANT_HIGH_MIN_LOGPROB: ${ASSISTANT_HIGH_MIN_LOGPROB:--0.35}
      ASSISTANT_MID_MIN_LOGPROB: ${ASSISTANT_MID_MIN_LOGPROB:--1.0}
      ASSISTANT_AUTO_ACCEPT_LIMIT_CENTS: ${ASSISTANT_AUTO_ACCEPT_LIMIT_CENTS:-250000}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
      assistant:
        condition: service_started
    environment:
      <<: *shared-environment
      PORT: "3000"
      # Empty during `docker compose build`; the container checks these at startup.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${APP_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ASSISTANT_SERVICE_URL: http://assistant:8001
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN:-dev-assistant-token}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-phi4-mini:3.8b}
      ASSISTANT_MODEL_QUANTIZATION: ${ASSISTANT_MODEL_QUANTIZATION:-Q4_K_M}
    volumes:
      - procureflow_runtime:/app/.data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
    environment:
      <<: *shared-environment
    volumes:
      - procureflow_runtime:/app/.data

volumes:
  procureflow_pgdata:
  procureflow_runtime:
